[alembic]
script_location = migrations
prepend_sys_path = src

# How Alembic splits multi-path options (prepend_sys_path, version_locations).
# `os` means os.pathsep — ';' on Windows, ':' on Linux. Without this Alembic
# falls back to legacy splitting on spaces, commas *and* colons, which mangles
# any absolute Windows path. Code that builds version_locations must join with
# os.pathsep to match — see tests/dbharness.py.
path_separator = os

# Revision filenames sort chronologically and carry a readable slug:
#   0001_baseline.py, 20260730_1412_add_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timestamps in filenames are local-time; keep them stable regardless of the
# developer's machine.
timezone = UTC

# Deliberately empty. migrations/env.py reads DATABASE_URL through
# home_ops.config, so there is exactly one place the connection string is
# configured and no credentials live in a tracked file.
sqlalchemy.url =


# Format generated revisions so `ruff format --check` in the test suite stays
# green. Type is `exec`, not `console_scripts`: ruff ships a prebuilt binary
# rather than registering a console-script entry point, so Alembic cannot
# resolve it the console_scripts way.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
