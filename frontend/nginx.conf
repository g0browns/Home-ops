# Reverse proxy for the production stack.
#
# This is what makes SPEC §2.1 tractable: one origin serves both the app and the
# API, split by path, so the browser only ever needs relative URLs and behaves
# identically whether it arrived via Cloudflare, the tailnet, or the LAN.
#
#   /api/*  -> the API
#   /*      -> the built SPA, with a history fallback
#
# `__API_UPSTREAM__` is substituted at **build** time — `api:8000` for the
# multi-container stack, `127.0.0.1:8000` for the single-container image. One
# file rather than two, because two copies of the X-Real-IP contract below is
# two chances to change only one of them.
#
# Substituted rather than an nginx variable on purpose: `proxy_pass http://$var`
# defers name resolution to request time and then needs a `resolver` directive,
# which is a live DNS dependency and a class of failure this does not need.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed assets are worth it over a home upstream.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 25m;

    location /api/ {
        # No add_header here, so the security headers above are inherited.
        proxy_pass http://__API_UPSTREAM__;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Set unconditionally, which is the whole point: whatever the client sent
        # is overwritten with the address nginx actually accepted the connection
        # from. `middleware/client_ip.py` treats this as authoritative and relies
        # on that guarantee — the two files have to stay in agreement.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CF-Connecting-IP is not touched here. It passes through when Cloudflare
        # set it, and the API only honours it when the hop was cloudflared.

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # A `location /homeops-mobile/` block proxied the PWA here until 2026-08-09.
    # A native Android app replaced it, so the path now falls through to the SPA
    # fallback below like any other unknown path.

    # Hashed build assets are immutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
    }

    # The SPA entry point. Never cached, or a deploy leaves clients loading
    # asset URLs that no longer exist.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
