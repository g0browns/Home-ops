# Security headers, in an include rather than written once at server level.
#
# nginx's `add_header` does not merge: a block containing any `add_header`
# discards every one inherited from its parent. So a location that sets a
# Cache-Control header silently drops these unless it repeats them, and the
# location that does that is `= /index.html` — the SPA entry point, i.e. the one
# page where they matter most. Including this file everywhere `add_header`
# appears keeps that from being a thing anyone has to remember.
#
# Deliberately NO Strict-Transport-Security. Two of the three access paths are
# plain HTTP by design (SPEC §2.1); TLS policy for the public hostname belongs
# to Cloudflare, not to this server block.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# A Content-Security-Policy lands in Phase 2, once the app shell exists and we
# know what it actually loads.
